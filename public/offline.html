<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>SAS Sports</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8fafc;background:#07111f}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;box-sizing:border-box;background:radial-gradient(circle at top,#102b49 0,#07111f 40%,#050b14 100%);text-align:center}
.mark{width:64px;height:64px;margin:0 auto 16px;border-radius:18px;display:grid;place-items:center;font-weight:950;letter-spacing:-1px;color:#07111f;background:linear-gradient(135deg,#7cf7c4,#42d3ff)}
h1{margin:0 0 8px;font-size:22px}p{margin:0 0 18px;color:#9db0c7;line-height:1.45;max-width:320px}
button{border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:850;cursor:pointer;background:linear-gradient(135deg,#7cf7c4,#42d3ff);color:#07111f}
</style>
</head>
<body>
<main>
  <div class="mark">SAS</div>
  <h1>You're offline</h1>
  <p>SAS Sports needs a connection for live scores and results. Reconnect and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>addEventListener('online',()=>location.reload())</script>
</body>
</html>

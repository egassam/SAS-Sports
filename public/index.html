async function apiFetch(path, attempts=4){
  let last;

      const r=await fetch(path,{cache:'no-store'});
      if(r.ok)return r;
      last=new Error(`HTTP ${r.status}`);
    }catch(e){last=e}
    if(i<attempts-1)await new Promise(resolve=>setTimeout(resolve,250*(i+1)));
  }
  throw last||new Error('Backend unavailable');
}

    const liveSchools=await r.json();
    if(Array.isArray(liveSchools)&&liveSchools.length){allSchools=liveSchools;populateSchoolControls()}
  }catch(err){
    status.textContent=`Loaded ${allSchools.length} schools from the SAS Sports package; reconnecting to live backend…`;
  }

async function loadFeed(){

      // Start the request immediately, but keep the branded loader visible long
      // enough to be perceived even when Cloudflare returns a cached response.
      const highlightRequest=apiFetch(`/live/highlights?school=${encodeURIComponent(e.school_id)}&sport=${encodeURIComponent(e.sport)}&event_id=${encodeURIComponent(e.id)}`,1);
      await new Promise(resolve=>setTimeout(resolve,1500));
      const r=await highlightRequest;
      const enriched=await r.json();
      if(enriched&&enriched.id)Object.assign(e,enriched);
    }catch{}
  }
  $('#modalTitle').textContent=e.title; $('#modalSub').textContent=`${e.school} · ${e.sport}`;
  const teamSummary=(e.results||[]).filter(x=>/\bteam$/i.test(x.participant||'')).map(x=>`${x.group}: ${x.result||x.place||x.value||''}`).join(' / ');
  const score=e.school_score!=null?`${e.school_score}–${e.opponent_score}`:(e.headline||teamSummary||'—');
  let lastGroup='';
  const rows=(e.results||[]).map(x=>{const group=x.group||'';const heading=group&&group!==lastGroup?`<div class="result-group-head">${esc(group)}</div>`:'';lastGroup=group;const isTeam=/\bteam$/i.test(x.participant||'');return heading+`<div class="result-row meet-result-row ${isTeam?'team-result':''}"><span>${esc(isTeam?'Team finish':(x.participant||x.label||'Result'))}</span><strong>${esc(x.result||x.place||x.value||'')}</strong></div>`}).join('');
  const resultsTitle=e.event_type==='MEET'?'Full Meet Results':'Full Team Results';
  const recapUrl=e.recap_url||(/recap/i.test(e.source?.name||'')?e.source?.url:null);
  const recapButton=recapUrl?`<a class="recap-button" href="${esc(recapUrl)}" target="_blank" rel="noopener">View Full Official Recap</a>`:'';
  const highlights=(e.highlights||[]).length?`<div class="highlights"><h4>Event Highlights</h4><ul>${e.highlights.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${recapButton}</div>`:'';
  const gameStats=(e.game_stats||[]).length?`<div class="game-stats">${e.game_stats.map(x=>`<div class="game-stat"><span>${esc(x.label)}</span><strong>${esc(x.value)}</strong></div>`).join('')}</div>`:'';
  const highlightStatus=e.highlight_status?`<div class="highlight-status">${esc(e.highlight_status)}</div>`:'';
  const source=e.source?.url?`<p class="small muted">Source: ${recapUrl?esc(e.source.name||'Official athletics source'):`<a class="official-link" href="${esc(e.source.url)}" target="_blank" rel="noopener">${esc(e.source.name||'Official athletics source')}</a>`} · verified ${esc(e.last_verified_at||e.source.updated_at||'now')}</p>`:'';
  $('#modalBody').innerHTML=`<div class="detail-grid"><div class="detail-box"><span>Status</span><b>${esc(e.status)}</b></div><div class="detail-box"><span>Score / result</span><b>${esc(score)}</b></div><div class="detail-box"><span>Start</span><b>${esc(eventTime(e)||'—')}</b></div><div class="detail-box"><span>Opponent</span><b>${esc(e.opponent||'—')}</b></div></div>${e.headline&&e.school_score==null?`<p>${esc(e.headline)}</p>`:''}${rows?`<div class="section-label">${esc(resultsTitle)}</div>${rows}`:(highlights?'':'<div class="small muted">No participant-level results available for this event.</div>')}${highlights}${!highlights?recapButton:''}${gameStats}${highlightStatus}${source}`;
}
function closeModal(){modalWrap.classList.remove('open');modalWrap.setAttribute('aria-hidden','true')}
refresh.addEventListener('click',loadFeed);
school.addEventListener('change',loadFeed);
conference.addEventListener('change',()=>{fillSchools();loadFeed()});
sportFilter.addEventListener('change',loadFeed);
search.addEventListener('input',()=>render(currentGroups));
tabs.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;currentView=b.dataset.view;tabs.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render(currentGroups)});
favorite.addEventListener('click',()=>{const on=localStorage.getItem('sas-sports-favorite')===school.value;if(on)localStorage.removeItem('sas-sports-favorite');else localStorage.setItem('sas-sports-favorite',school.value);updateFavorite()});
$('#modalClose').addEventListener('click',closeModal); modalWrap.addEventListener('click',e=>{if(e.target===modalWrap)closeModal()}); document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
populateSportFilter();
(async()=>{try{await loadSchools();await loadFeed()}catch(e){status.textContent=e.message}})();
</script>
</body>
</html>

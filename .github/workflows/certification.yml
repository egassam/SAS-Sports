name: SAS Sports certification

on:
  schedule:
    - cron: '0 8 * * 1'
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_school:
        description: Optional school ID to deep-certify before adding it to the protected list
        required: false
        type: string
      full_audit:
        description: Run the throttled all-sports isolation audit
        required: false
        default: false
        type: boolean

concurrency:
  group: certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:release

  certification-matrix:
    runs-on: ubuntu-latest
    needs: guardrails
    outputs:
      schools: ${{ steps.matrix.outputs.schools }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        run: echo "schools=$(node -e \"const x=require('./tests/certified-schools.json');process.stdout.write(JSON.stringify(x.schools.map(s=>s.id)))\")" >> "$GITHUB_OUTPUT"

  live-certified-schools:
    # Pull requests test their parser and invariants locally. The public URL is
    # still the old deployment until merge, so testing it here creates false
    # failures and notification spam. Live certification runs after main moves.
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.full_audit) }}
    # A push tests the currently deployed Worker, which may still be the old
    # version waiting on this check. Report those results without deadlocking
    # deployment; manual/scheduled audits remain strict release evidence.
    continue-on-error: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # Isolation makes repeated live requests. Finish it before per-school
    # certification so the test suite cannot overload the production Worker.
    needs: [guardrails, cross-school-isolation, certification-matrix]
    strategy:
      fail-fast: false
      # The Worker has a strict CPU budget. Serial live certification prevents
      # the test runner itself from creating false resource-limit failures.
      max-parallel: 1
      matrix:
        school: ${{ fromJSON(needs.certification-matrix.outputs.schools) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/validate-schools.mjs --schools=${{ matrix.school }}

  cross-school-isolation:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.full_audit) }}
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:isolation:smoke

  full-live-isolation:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_audit) }}
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:isolation:full

  candidate-school:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_school != '' }}
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/validate-schools.mjs --schools=${{ inputs.candidate_school }} --deep

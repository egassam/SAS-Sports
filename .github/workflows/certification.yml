name: SAS Sports certification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_school:
        description: Optional school ID to deep-certify before adding it to the protected list
        required: false
        type: string

concurrency:
  group: certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:release

  live-certified-schools:
    # Pull requests test their parser and invariants locally. The public URL is
    # still the old deployment until merge, so testing it here creates false
    # failures and notification spam. Live certification runs after main moves.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # Isolation makes repeated live requests. Finish it before per-school
    # certification so the test suite cannot overload the production Worker.
    needs: [guardrails, cross-school-isolation]
    strategy:
      fail-fast: false
      # The Worker has a strict CPU budget. Serial live certification prevents
      # the test runner itself from creating false resource-limit failures.
      max-parallel: 1
      matrix:
        school: [kstate, kansas, florida, arizona, arizona-state, oklahoma-state, texas-tech, baylor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/validate-schools.mjs --schools=${{ matrix.school }}

  cross-school-isolation:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:isolation

  candidate-school:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.candidate_school != '') || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/validate-schools.mjs --schools=${{ github.event_name == 'push' && 'byu' || inputs.candidate_school }} --sports=Cross\ Country,Soccer,Volleyball,Football --deep

  candidate-byu-athletes:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: guardrails
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sport: [Baseball, Basketball, Cross Country, Football, Golf, Gymnastics, Soccer, Softball, Swimming & Diving, Tennis, Track & Field, Volleyball]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/validate-schools.mjs --schools=byu --sports="${{ matrix.sport }}" --athletes-only
